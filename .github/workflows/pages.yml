name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.NALMOA_API_BASE_URL || 'https://zdhgmzdzmhyxryrzoaqx.supabase.co/functions/v1/nalmoa' }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.API_BASE_URL) throw new Error('Set NALMOA_API_BASE_URL to the public HTTPS backend base URL.');
          const url = new URL(process.env.API_BASE_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('Set NALMOA_API_BASE_URL to the public HTTPS backend base URL.');
          }
          writeFileSync('web/config.js', 'window.API_BASE_URL = ' + JSON.stringify(url.href.replace(/\/$/, '')) + ';\n');
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
